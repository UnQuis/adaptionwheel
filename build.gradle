plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.192'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Имя jar'а несёт версию игры: adaptionwheel-0.1.4+mc1.21.1.jar. Один источник
// правды — minecraft_version из gradle.properties, тот же, что уходит в
// neoforge.mods.toml, так что подставить руками расхождение нельзя.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar') {
    // То же самое машинно-читаемо, без распаковки: unzip -p <jar> META-INF/MANIFEST.MF
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'Minecraft-Version'     : minecraft_version,
                'NeoForge-Version'      : neo_version,
                'FMLLoader-Type'        : 'NEOFORGE',
        ])
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        // Optional quick-play hook for automated visual smoke tests:
        // AW_QUICKPLAY="singleplayer/New World"            ./gradlew runClient
        // AW_QUICKPLAY="multiplayer/127.0.0.1:25565"       ./gradlew runClient
        if (System.getenv('AW_QUICKPLAY')?.startsWith('multiplayer/')) {
            programArguments '--quickPlayMultiplayer', System.getenv('AW_QUICKPLAY').replaceFirst('^multiplayer/', '')
        } else if (System.getenv('AW_QUICKPLAY')) {
            programArguments '--quickPlaySingleplayer', System.getenv('AW_QUICKPLAY').replaceFirst('^singleplayer/', '')
        }
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Mixin annotations + MixinExtras (both provided at runtime by NeoForge)
    compileOnly 'org.spongepowered:mixin:0.8.5'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.3'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}