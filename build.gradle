plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Имя jar'а несёт версию игры: adaptionwheel-0.1.5+mc26.3.jar. Один источник
// правды — minecraft_version из gradle.properties, тот же, что уходит в
// neoforge.mods.toml, так что подставить руками расхождение нельзя.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar') {
    // То же самое машинно-читаемо, без распаковки: unzip -p <jar> META-INF/MANIFEST.MF
    manifest {
        attributes([
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'Minecraft-Version'     : minecraft_version,
                'NeoForge-Version'      : neo_version,
                'FMLLoader-Type'        : 'NEOFORGE',
        ])
    }
}

// Mojang ships Java 25 to end users in 26.3, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        // Optional quick-play hook for automated visual smoke tests:
        // AW_QUICKPLAY="singleplayer/New World" ./gradlew runClient
        if (System.getenv('AW_QUICKPLAY')) {
            programArguments '--quickPlaySingleplayer', System.getenv('AW_QUICKPLAY').replaceFirst('^singleplayer/', '')
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Curios is an OPTIONAL runtime integration (see compat/CuriosCompat): there is no
    // Curios build for Minecraft 26.3 yet, so it is bound reflectively and not a compile
    // dependency. Once a 26.3 artifact exists it can be added as `localRuntime` for testing.

    // Mixin annotations + MixinExtras (both provided at runtime by NeoForge 26.3)
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}