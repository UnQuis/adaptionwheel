license="${mod_license}"

[[mixins]]
config = "adaptionwheel.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"

[[dependencies.${mod_id}]]
    modId="neoforge"
    versionRange="${neo_version_range}"
    ordering="NONE"
    type="required"

[[dependencies.${mod_id}]]
    modId="minecraft"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    type="required"

# Optional: with Curios installed the wheel gets its dedicated "wheel" curio slot;
# without it the wheel counts as worn from the off-hand / main inventory.
# Curios has no Minecraft 26.3 build yet, so it is bound reflectively (compat/CuriosCompat).
[[dependencies.${mod_id}]]
    modId="curios"
    versionRange="*"
    ordering="AFTER"
    type="optional"

# Soft integration: dedicated Chaos Guardian adaptation (existence + all attacks).
# Everything degrades gracefully when the mod is absent.
# NOTE: NeoForge 21+ parses the "type" field; the legacy Forge "mandatory" key is
# silently ignored and would default this dependency to REQUIRED, crashing any
# install without Draconic Evolution.
[[dependencies.${mod_id}]]
    modId="draconicevolution"
    versionRange="*"
    ordering="AFTER"
    type="optional"